<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="170" fill="#000000"/>

  <path d="M0,150 C150,132 350,168 600,150 C850,132 1050,168 1200,150 L1200,170 L0,170 Z" fill="#ffffff" opacity="0.06"/>

  <!-- crescent moon -->
  <circle cx="150" cy="42" r="22" fill="#f5f0dc"/>
  <circle cx="160" cy="36" r="19" fill="#000000"/>

  <!-- twinkling stars -->
  <circle cx="90" cy="60" r="1.6" fill="#f5f5f5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="25" r="1.3" fill="#f5f5f5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="30" r="1.4" fill="#f5f5f5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="55" r="1.2" fill="#f5f5f5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>

  <!-- flying bats -->
  <g fill="#9b86c2" opacity="0.75">
    <g transform="translate(-30,50)">
      <animateTransform attributeName="transform" type="translate" values="-30,50;1260,20" dur="10s" begin="0s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.35;1,1" dur="0.35s" repeatCount="indefinite"/>
        <path d="M0,0 C-9,-7 -18,-5 -22,1 C-15,0 -8,3 0,0 C8,3 15,0 22,1 C18,-5 9,-7 0,0 Z"/>
      </g>
    </g>
    <g transform="translate(-30,85)">
      <animateTransform attributeName="transform" type="translate" values="-30,85;1260,110" dur="13s" begin="3s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.35;1,1" dur="0.3s" repeatCount="indefinite"/>
        <path d="M0,0 C-7,-5.5 -14,-4 -17,0.8 C-11.5,0 -6,2.3 0,0 C6,2.3 11.5,0 17,0.8 C14,-4 7,-5.5 0,0 Z"/>
      </g>
    </g>
    <g transform="translate(-30,30)">
      <animateTransform attributeName="transform" type="translate" values="-30,30;1260,65" dur="11.5s" begin="6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.35;1,1" dur="0.4s" repeatCount="indefinite"/>
        <path d="M0,0 C-6,-4.7 -12,-3.4 -14.5,0.7 C-10,0 -5,2 0,0 C5,2 10,0 14.5,0.7 C12,-3.4 6,-4.7 0,0 Z"/>
      </g>
    </g>
  </g>

  <!-- sign-off text -->
  <text x="600" y="90" font-family="Cascadia Code, Consolas, monospace" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Thanks for stopping by!</text>
  <text x="600" y="122" font-family="Cascadia Code, Consolas, monospace" font-size="16" fill="#9b86c2" text-anchor="middle">— Vaibhav Sen 🦇</text>
</svg>
