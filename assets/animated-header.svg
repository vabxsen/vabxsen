<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="380" fill="#000000"/>

  <path d="M0,358 C150,338 350,380 600,358 C850,336 1050,380 1200,358 L1200,380 L0,380 Z" fill="#ffffff" opacity="0.06"/>

  <text x="600" y="175" font-family="Cascadia Code, Consolas, monospace" font-size="76" font-weight="700" fill="#ffffff" text-anchor="middle">Vaibhav Sen</text>
  <text x="600" y="218" font-family="Cascadia Code, Consolas, monospace" font-size="24" fill="#e6e6e6" text-anchor="middle">Indie Developer • Solo Builder</text>

  <g transform="translate(1080,155) scale(1.3)">
   <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="1.8s" repeatCount="indefinite"/>

    <!-- speech bubble -->
    <g>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="2s" repeatCount="indefinite"/>
      <rect x="34" y="-38" width="46" height="28" rx="10" fill="#f5f5f5"/>
      <path d="M40,-10 L30,-2 L46,-10 Z" fill="#f5f5f5"/>
      <text x="57" y="-19" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#0a0a0f" text-anchor="middle">Hi!</text>
    </g>

    <!-- legs -->
    <line x1="0" y1="100" x2="-8" y2="128" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>
    <line x1="-8" y1="128" x2="-11" y2="150" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="100" x2="8" y2="128" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>
    <line x1="8" y1="128" x2="11" y2="150" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>

    <!-- pelvis -->
    <path d="M-12,96 L12,96 L8,106 L-8,106 Z" fill="#f0f0f0"/>

    <!-- ribcage -->
    <rect x="-15" y="45" width="30" height="52" rx="10" fill="none" stroke="#f0f0f0" stroke-width="3"/>
    <line x1="0" y1="45" x2="0" y2="97" stroke="#f0f0f0" stroke-width="2"/>
    <line x1="-13" y1="55" x2="13" y2="55" stroke="#f0f0f0" stroke-width="2"/>
    <line x1="-13" y1="65" x2="13" y2="65" stroke="#f0f0f0" stroke-width="2"/>
    <line x1="-13" y1="75" x2="13" y2="75" stroke="#f0f0f0" stroke-width="2"/>
    <line x1="-13" y1="85" x2="13" y2="85" stroke="#f0f0f0" stroke-width="2"/>

    <!-- static left arm -->
    <line x1="-15" y1="52" x2="-24" y2="72" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>
    <line x1="-24" y1="72" x2="-20" y2="92" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>

    <!-- waving right arm, rotates around shoulder -->
    <g transform="translate(15,52)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-15;30;-15" dur="0.9s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="16" y2="-16" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>
        <line x1="16" y1="-16" x2="25" y2="-34" stroke="#f0f0f0" stroke-width="6" stroke-linecap="round"/>
        <circle cx="25" cy="-34" r="5.5" fill="#f0f0f0"/>
        <line x1="25" y1="-34" x2="31" y2="-42" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="25" y1="-34" x2="25" y2="-44" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="25" y1="-34" x2="19" y2="-42" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- neck + skull -->
    <line x1="0" y1="38" x2="0" y2="45" stroke="#f0f0f0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="21" fill="#f0f0f0"/>

    <!-- crack -->
    <path d="M13,1 L17,-7 L15,-12" stroke="#0a0a0f" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- furrowed brow -->
    <path d="M-15,7 Q-8,2 -2,7" stroke="#0a0a0f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M2,7 Q8,2 15,7" stroke="#0a0a0f" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- angular hollow eye sockets -->
    <path d="M-14,10 L-3,10 L-5,21 L-12,21 Z" fill="#0a0a0f"/>
    <path d="M14,10 L3,10 L5,21 L12,21 Z" fill="#0a0a0f"/>

    <!-- glowing red pupils -->
    <circle cx="-8" cy="15" r="2.2" fill="#ff2b2b">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="15" r="2.2" fill="#ff2b2b">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- nasal cavity -->
    <path d="M-4,23 L4,23 L0,31 Z" fill="#0a0a0f"/>

    <!-- jagged toothy grin -->
    <path d="M-13,33 L-10,39 L-7,33 L-4,39 L-1,33 L2,39 L5,33 L8,39 L11,33 L13,37" stroke="#0a0a0f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
   </g>
  </g>

  <g transform="translate(140,190) scale(1.1)">
   <g>
    <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="2.6s" repeatCount="indefinite"/>
   <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="2.1s" repeatCount="indefinite"/>

    <!-- sparkles trailing the broom -->
    <circle cx="-70" cy="30" r="1.6" fill="#f5f5f5"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="-80" cy="46" r="1.2" fill="#f5f5f5"><animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="-68" cy="60" r="1.4" fill="#f5f5f5"><animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.8s" repeatCount="indefinite"/></circle>

    <!-- broom bristles -->
    <g stroke="#c9a24b" stroke-width="2" stroke-linecap="round">
      <line x1="-52" y1="46" x2="-64" y2="38"/>
      <line x1="-52" y1="46" x2="-66" y2="46"/>
      <line x1="-52" y1="46" x2="-64" y2="54"/>
      <line x1="-52" y1="46" x2="-60" y2="60"/>
    </g>
    <!-- broom handle -->
    <line x1="-52" y1="46" x2="38" y2="14" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>

    <!-- robe -->
    <path d="M-14,0 L14,0 L23,42 L-23,42 Z" fill="#f0f0f0"/>

    <!-- arms holding broom -->
    <line x1="-12" y1="4" x2="-30" y2="24" stroke="#f0f0f0" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="4" x2="26" y2="18" stroke="#f0f0f0" stroke-width="5" stroke-linecap="round"/>

    <!-- neck -->
    <line x1="0" y1="-4" x2="0" y2="0" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>

    <!-- hair -->
    <path d="M-14,-24 Q-21,-12 -13,0" stroke="#3a2a1a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- face -->
    <circle cx="0" cy="-18" r="15" fill="#f0f0f0"/>

    <!-- long witch nose with wart -->
    <path d="M9,-17 Q26,-12 22,-2 Q16,-8 8,-10 Z" fill="#f0f0f0"/>
    <circle cx="22" cy="-3" r="1.6" fill="#0a0a0f"/>

    <!-- eyes -->
    <circle cx="-6" cy="-19" r="2" fill="#0a0a0f"/>
    <circle cx="3" cy="-21" r="1.6" fill="#0a0a0f"/>

    <!-- smirk -->
    <path d="M-6,-9 Q0,-5 6,-10" stroke="#0a0a0f" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- witch hat -->
    <ellipse cx="0" cy="-32" rx="20" ry="5" fill="#241533"/>
    <path d="M-13,-32 L2,-78 L13,-32 Z" fill="#2e1a40"/>
    <rect x="-14" y="-38" width="24" height="6" fill="#6b2fa1"/>
   </g>
   </g>
  </g>
</svg>
