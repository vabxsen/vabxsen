<svg width="300" height="70" viewBox="0 0 300 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="candleGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- candle 1 -->
  <g>
    <rect x="60" y="40" width="20" height="26" rx="2" fill="#efe3ca"/>
    <rect x="60" y="40" width="20" height="4" fill="#d8c9a8"/>
    <line x1="70" y1="40" x2="70" y2="34" stroke="#5a4a34" stroke-width="1.4"/>
    <path d="M 70,34 Q 66,26 70,20 Q 74,26 70,34 Z" fill="#ffb347" filter="url(#candleGlow)">
      <animate attributeName="opacity" values="1;0.8;1;0.6;1;0.9;1" dur="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="-4 70 34;3 70 34;-4 70 34" dur="1.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- candle 2 (taller, center) -->
  <g>
    <rect x="140" y="26" width="20" height="40" rx="2" fill="#efe3ca"/>
    <rect x="140" y="26" width="20" height="4" fill="#d8c9a8"/>
    <line x1="150" y1="26" x2="150" y2="19" stroke="#5a4a34" stroke-width="1.4"/>
    <path d="M 150,19 Q 145,10 150,3 Q 155,10 150,19 Z" fill="#ffb347" filter="url(#candleGlow)">
      <animate attributeName="opacity" values="1;0.85;1;0.65;1;0.92;1" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="3 150 19;-4 150 19;3 150 19" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- candle 3 -->
  <g>
    <rect x="220" y="40" width="20" height="26" rx="2" fill="#efe3ca"/>
    <rect x="220" y="40" width="20" height="4" fill="#d8c9a8"/>
    <line x1="230" y1="40" x2="230" y2="34" stroke="#5a4a34" stroke-width="1.4"/>
    <path d="M 230,34 Q 226,26 230,20 Q 234,26 230,34 Z" fill="#ffb347" filter="url(#candleGlow)">
      <animate attributeName="opacity" values="1;0.75;1;0.9;1;0.6;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 230 34;4 230 34;-3 230 34" dur="1.1s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
