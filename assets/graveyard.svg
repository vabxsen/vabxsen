<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="fogBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="wispBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#000000"/>

  <!-- faint stars -->
  <circle cx="90" cy="24" r="1.2" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="30" r="1.3" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="16" r="1.1" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.1s" begin="0.5s" repeatCount="indefinite"/></circle>

  <!-- ground -->
  <path d="M0,180 C200,168 350,190 600,178 C850,166 1000,190 1200,178 L1200,220 L0,220 Z" fill="#0d0d14"/>

  <!-- tombstones -->
  <g font-family="Cascadia Code, Consolas, monospace" text-anchor="middle">
    <g>
      <path d="M 85,170 L 85,100 A 45,30 0 0,1 175,100 L 175,170 Z" fill="#7a7a86" stroke="#4a4a54" stroke-width="2"/>
      <line x1="98" y1="130" x2="162" y2="130" stroke="#4a4a54" stroke-width="1.5" opacity="0.6"/>
      <text x="130" y="120" font-size="13" font-weight="700" fill="#2e2e38">SLIP</text>
      <text x="130" y="150" font-size="9" fill="#4a4a54">rest in ship</text>
    </g>
    <g>
      <path d="M 305,170 L 305,100 A 45,30 0 0,1 395,100 L 395,170 Z" fill="#7a7a86" stroke="#4a4a54" stroke-width="2"/>
      <line x1="318" y1="130" x2="382" y2="130" stroke="#4a4a54" stroke-width="1.5" opacity="0.6"/>
      <text x="350" y="120" font-size="13" font-weight="700" fill="#2e2e38">DOCLEE</text>
      <text x="350" y="150" font-size="9" fill="#4a4a54">ship happens</text>
    </g>
    <g>
      <path d="M 555,170 L 555,100 A 45,30 0 0,1 645,100 L 645,170 Z" fill="#7a7a86" stroke="#4a4a54" stroke-width="2"/>
      <line x1="568" y1="130" x2="632" y2="130" stroke="#4a4a54" stroke-width="1.5" opacity="0.6"/>
      <text x="600" y="120" font-size="13" font-weight="700" fill="#2e2e38">NEXRIG</text>
      <text x="600" y="150" font-size="9" fill="#4a4a54">compiling...</text>
    </g>
    <g>
      <path d="M 795,170 L 795,100 A 45,30 0 0,1 885,100 L 885,170 Z" fill="#7a7a86" stroke="#4a4a54" stroke-width="2"/>
      <line x1="808" y1="130" x2="872" y2="130" stroke="#4a4a54" stroke-width="1.5" opacity="0.6"/>
      <text x="840" y="120" font-size="12" font-weight="700" fill="#2e2e38">PRICEPILOT</text>
      <text x="840" y="150" font-size="9" fill="#4a4a54">still watching</text>
    </g>
    <g>
      <path d="M 1025,170 L 1025,100 A 45,30 0 0,1 1115,100 L 1115,170 Z" fill="#7a7a86" stroke="#4a4a54" stroke-width="2"/>
      <line x1="1038" y1="130" x2="1102" y2="130" stroke="#4a4a54" stroke-width="1.5" opacity="0.6"/>
      <text x="1070" y="120" font-size="13" font-weight="700" fill="#2e2e38">DAILYNX</text>
      <text x="1070" y="150" font-size="9" fill="#4a4a54">day by day</text>
    </g>
  </g>

  <!-- rising spirit wisps over a couple of graves -->
  <ellipse cx="130" cy="95" rx="4" ry="8" fill="#b9c2e0" opacity="0" filter="url(#wispBlur)">
    <animate attributeName="opacity" values="0;0.3;0" keyTimes="0;0.4;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,-30" dur="4s" begin="0s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="95" rx="4" ry="8" fill="#b9c2e0" opacity="0" filter="url(#wispBlur)">
    <animate attributeName="opacity" values="0;0.3;0" keyTimes="0;0.4;1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;6,-32" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1070" cy="95" rx="4" ry="8" fill="#b9c2e0" opacity="0" filter="url(#wispBlur)">
    <animate attributeName="opacity" values="0;0.3;0" keyTimes="0;0.4;1" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,-28" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- drifting fog -->
  <ellipse cx="300" cy="185" rx="220" ry="18" fill="#c9c9d4" opacity="0.06" filter="url(#fogBlur)">
    <animateTransform attributeName="transform" type="translate" values="-100,0;100,0;-100,0" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="900" cy="190" rx="260" ry="20" fill="#c9c9d4" opacity="0.05" filter="url(#fogBlur)">
    <animateTransform attributeName="transform" type="translate" values="100,0;-120,0;100,0" dur="22s" repeatCount="indefinite"/>
  </ellipse>
</svg>
