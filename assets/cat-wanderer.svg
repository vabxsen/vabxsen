<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="150" fill="#000000"/>

  <!-- faint stars -->
  <circle cx="100" cy="28" r="1.3" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="105" r="1.1" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="22" r="1.4" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="1130" cy="90" r="1.2" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.1s" begin="0.4s" repeatCount="indefinite"/></circle>

  <!-- ground line -->
  <line x1="0" y1="128" x2="1200" y2="128" stroke="#2a2a38" stroke-width="1"/>

  <!-- wandering black cat -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-80,115;1280,115" dur="15s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0;0,-3;0,0" dur="0.6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1,1;1,1;1.22,0.86;1,1;1,1" keyTimes="0;0.44;0.5;0.56;1" dur="15s" repeatCount="indefinite"/>

        <!-- tail, swishing from its base near the body -->
        <path d="M -20,-2 Q -34,-8 -31,-22 Q -29,-31 -19,-30" fill="none" stroke="#111116" stroke-width="6" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" values="-9 -20 -2;9 -20 -2;-9 -20 -2" dur="1.3s" repeatCount="indefinite"/>
        </path>

        <!-- body -->
        <ellipse cx="0" cy="0" rx="24" ry="13" fill="#111116"/>

        <!-- head -->
        <circle cx="23" cy="-9" r="10.5" fill="#111116"/>

        <!-- ears -->
        <path d="M 14,-17 L 18,-25 L 22,-17 Z" fill="#111116"/>
        <path d="M 22,-17 L 26,-26 L 30,-17 Z" fill="#111116"/>

        <!-- eyes, blinking -->
        <ellipse cx="19.5" cy="-9.5" rx="1.7" ry="2.4" fill="#c8e04a">
          <animate attributeName="ry" values="2.4;2.4;0.4;2.4;2.4" keyTimes="0;0.9;0.94;0.98;1" dur="3.4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="26.5" cy="-9.5" rx="1.7" ry="2.4" fill="#c8e04a">
          <animate attributeName="ry" values="2.4;2.4;0.4;2.4;2.4" keyTimes="0;0.9;0.94;0.98;1" dur="3.4s" repeatCount="indefinite"/>
        </ellipse>

        <!-- nose -->
        <path d="M 22.3,-5.5 L 23.7,-5.5 L 23,-4.5 Z" fill="#e8a0b0"/>
      </g>
    </g>
  </g>
</svg>
