<svg width="500" height="80" viewBox="0 0 500 80" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="80" rx="10" fill="#0a0a0f" stroke="#1f1f2e" stroke-width="1"/>

  <text x="16" y="24" font-family="Consolas, 'Cascadia Code', monospace" font-size="12" font-weight="600" fill="#8a8a99">STATUS: STILL ALIVE</text>

  <!-- flat baseline -->
  <line x1="16" y1="56" x2="484" y2="56" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>

  <!-- ekg trace, always fully visible -->
  <path d="M 16,56 L 380,56 L 392,56 L 400,30 L 408,74 L 416,44 L 424,56 L 484,56"
        fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- soft glow dot pulsing along the trace -->
  <circle r="3.5" fill="#22d3ee">
    <animateMotion dur="2.4s" repeatCount="indefinite"
      path="M 16,56 L 380,56 L 392,56 L 400,30 L 408,74 L 416,44 L 424,56 L 484,56"/>
  </circle>
</svg>
