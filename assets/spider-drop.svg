<svg width="80" height="200" viewBox="0 0 80 200" xmlns="http://www.w3.org/2000/svg">
  <!-- silk thread, its length tracks the spider's drop -->
  <line x1="40" y1="0" x2="40" y2="14" stroke="#6b6b78" stroke-width="1.2">
    <animate attributeName="y2" values="14;14;150;150;14;14" keyTimes="0;0.15;0.45;0.65;0.9;1" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- spider, drops down then retracts on loop -->
  <g transform="translate(40,14)">
    <animateTransform attributeName="transform" type="translate" values="40,14;40,14;40,150;40,150;40,14;40,14" keyTimes="0;0.15;0.45;0.65;0.9;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0;-3,0;0,0" dur="1.8s" repeatCount="indefinite"/>

      <!-- legs -->
      <g stroke="#0d0d12" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M -6,-2 Q -14,-6 -18,-2"/>
        <path d="M -6,1 Q -15,2 -19,6"/>
        <path d="M -5,4 Q -13,9 -16,14"/>
        <path d="M -4,7 Q -10,13 -12,18"/>
        <path d="M 6,-2 Q 14,-6 18,-2"/>
        <path d="M 6,1 Q 15,2 19,6"/>
        <path d="M 5,4 Q 13,9 16,14"/>
        <path d="M 4,7 Q 10,13 12,18"/>
      </g>

      <!-- body -->
      <ellipse cx="0" cy="6" rx="7" ry="6" fill="#0d0d12"/>
      <circle cx="0" cy="-3" r="4" fill="#0d0d12"/>

      <!-- eyes -->
      <circle cx="-1.5" cy="-3.5" r="0.9" fill="#ff3b3b"/>
      <circle cx="1.5" cy="-3.5" r="0.9" fill="#ff3b3b"/>
    </g>
  </g>
</svg>
