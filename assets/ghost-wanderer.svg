<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="150" fill="#000000"/>

  <!-- faint stars -->
  <circle cx="80" cy="30" r="1.3" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="110" r="1.1" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="25" r="1.4" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="1120" cy="100" r="1.2" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.1s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="20" r="1.1" fill="#f5f5f5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></circle>

  <!-- speech bubble, fades in as the ghost drifts through the middle -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.42;0.58;0.68;1" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(520,18)">
      <rect x="0" y="0" width="180" height="46" rx="14" fill="#12121a" stroke="#8b5cf6" stroke-width="1.5"/>
      <path d="M78,46 L92,46 L82,60 Z" fill="#12121a" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="90" y="29" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="600" fill="#e6e6e6" text-anchor="middle">Boo! You found me</text>
    </g>
  </g>

  <!-- wandering ghost -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-100,0;1300,0" dur="16s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,55;0,35;0,68;0,42;0,55" dur="4s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 40 40;6 40 40;-6 40 40" dur="2.4s" repeatCount="indefinite"/>

        <!-- glow -->
        <circle cx="40" cy="35" r="46" fill="#8b5cf6" opacity="0.16">
          <animate attributeName="opacity" values="0.1;0.22;0.1" dur="2.4s" repeatCount="indefinite"/>
        </circle>

        <!-- trailing wisps -->
        <circle cx="-18" cy="42" r="5" fill="#e8e3ff" opacity="0.25"/>
        <circle cx="-30" cy="38" r="3" fill="#e8e3ff" opacity="0.15"/>

        <!-- body -->
        <path d="M0,40 C0,17.9 17.9,0 40,0 C62.1,0 80,17.9 80,40 L80,70 Q70,85 60,70 Q50,85 40,70 Q30,85 20,70 Q10,85 0,70 Z"
              fill="#e8e3ff" opacity="0.94" stroke="#b8a9e8" stroke-width="1.2"/>

        <!-- eyes -->
        <ellipse cx="27" cy="36" rx="5" ry="6.5" fill="#1a1a2e">
          <animate attributeName="ry" values="6.5;6.5;0.5;6.5;6.5" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="53" cy="36" rx="5" ry="6.5" fill="#1a1a2e">
          <animate attributeName="ry" values="6.5;6.5;0.5;6.5;6.5" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
        </ellipse>

        <!-- mouth -->
        <ellipse cx="40" cy="50" rx="6" ry="8" fill="#1a1a2e"/>
      </g>
    </g>
  </g>
</svg>
