  <rect width="1200" height="200" fill="url(#animGrad)"/>

  <text x="600" y="100" font-family="Consolas,'Cascadia Code',monospace" font-size="46" font-weight="700" fill="#f5f5f7" text-anchor="middle">Vaibhav Sen</text>
  <text x="600" y="136" font-family="Consolas,'Cascadia Code',monospace" font-size="18" font-weight="500" fill="#e6e6e6" text-anchor="middle" letter-spacing="1">Indie Developer &#8226; Solo Builder</text>
