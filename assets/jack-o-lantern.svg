<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="pumpkinGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smokeBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- rising smoke wisps -->
  <ellipse cx="62" cy="14" rx="3" ry="6" fill="#b9b9c2" opacity="0" filter="url(#smokeBlur)">
    <animate attributeName="opacity" values="0;0.3;0" keyTimes="0;0.4;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-5,-24" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="60" cy="14" rx="2.5" ry="5" fill="#b9b9c2" opacity="0" filter="url(#smokeBlur)">
    <animate attributeName="opacity" values="0;0.25;0" keyTimes="0;0.4;1" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;4,-22" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="63" cy="14" rx="2" ry="4" fill="#b9b9c2" opacity="0" filter="url(#smokeBlur)">
    <animate attributeName="opacity" values="0;0.2;0" keyTimes="0;0.4;1" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,-20" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- whole pumpkin, gently rocking as if alive -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 60 68;3 60 68;-3 60 68" dur="2.4s" repeatCount="indefinite"/>

    <!-- soft ambient glow behind the pumpkin, flickering and shifting eerie hues -->
    <ellipse cx="60" cy="68" rx="38" ry="30" fill="#ff9d33" opacity="0.35">
      <animate attributeName="fill" values="#ff9d33;#8affa0;#ff9d33;#b892ff;#ff9d33" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.4;0.22;0.38;0.28;0.4;0.25" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- stem -->
    <path d="M 55,32 Q 53,20 62,16 Q 68,14 66,22 Q 64,30 58,34 Z" fill="#5b7a3a"/>

    <!-- pumpkin body -->
    <ellipse cx="60" cy="68" rx="42" ry="34" fill="#d9622b"/>
    <path d="M 30,68 Q 30,38 32,36" fill="none" stroke="#b8481a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 46,68 Q 46,34 47,32" fill="none" stroke="#b8481a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 60,68 Q 60,33 60,31" fill="none" stroke="#b8481a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 74,68 Q 74,34 73,32" fill="none" stroke="#b8481a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 90,68 Q 90,38 88,36" fill="none" stroke="#b8481a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- carved face, glowing and shifting eerie hues -->
    <g filter="url(#pumpkinGlow)">
      <g fill="#ffcf6b">
        <path d="M 42,58 L 52,58 L 44,70 Z">
          <animate attributeName="fill" values="#ffcf6b;#9bffb0;#ffcf6b;#c9a8ff;#ffcf6b" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.8;1;0.65;1;0.9;1" dur="2.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 78,58 L 68,58 L 76,70 Z">
          <animate attributeName="fill" values="#ffcf6b;#9bffb0;#ffcf6b;#c9a8ff;#ffcf6b" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.8;1;0.65;1;0.9;1" dur="2.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 40,82 Q 46,90 52,82 Q 56,90 60,82 Q 64,90 68,82 Q 74,90 80,82 Q 74,96 60,96 Q 46,96 40,82 Z">
          <animate attributeName="fill" values="#ffcf6b;#9bffb0;#ffcf6b;#c9a8ff;#ffcf6b" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.85;1;0.7;1;0.92;1" dur="2.6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
